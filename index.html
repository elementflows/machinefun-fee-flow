<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relay — fee flow</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --txt:#e6edf3; --dim:#8b949e;
    --ray:#f85149; --pool:#d29922; --ours:#3fb950; --arith:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{padding:18px 24px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  #controls{display:flex;gap:28px;align-items:center;flex-wrap:wrap;
    padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  .ctl{display:flex;gap:9px;align-items:center}
  .ctl label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  select,input[type=range]{background:#0d1117;color:var(--txt);
    border:1px solid var(--line);border-radius:5px;padding:4px 7px;font:inherit;font-size:12px}
  input[type=range]{padding:0;width:190px}
  .seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .seg button{background:#0d1117;color:var(--dim);border:0;padding:5px 11px;
    font:inherit;font-size:11px;cursor:pointer}
  .seg button.on{background:#1f6feb;color:#fff}
  #vol{font-variant-numeric:tabular-nums;min-width:82px;color:var(--ours)}
  #wrap{display:flex;height:calc(100vh - 132px)}
  #chart{flex:1;min-width:0}
  #side{width:340px;border-left:1px solid var(--line);background:var(--panel);
    padding:18px;overflow-y:auto}
  #side h2{font-size:12px;margin:0 0 3px;letter-spacing:.4px}
  #side .rate{font-size:26px;font-weight:600;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  #side .amt{color:var(--dim);font-size:12px;margin-bottom:14px}
  .ev{margin-top:16px;padding:10px;border-radius:6px;font-size:11px;line-height:1.6;
    background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25)}
  .ev b{color:var(--ours);display:block;margin-bottom:4px;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px}
  .hint{color:var(--dim);font-size:11.5px;line-height:1.7}
  .totals{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
  .trow{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;
    font-variant-numeric:tabular-nums}
  .trow b{font-weight:600}
  svg text{font-family:ui-monospace,Menlo,monospace}
  .node{cursor:pointer}
  .edge{cursor:pointer}
  #tip{position:absolute;pointer-events:none;background:#1c2128;border:1px solid var(--line);
    border-radius:6px;padding:8px 11px;font-size:11.5px;opacity:0;transition:opacity .12s;
    max-width:290px;line-height:1.6;z-index:10}
</style>
</head>
<body>

<header>
  <h1>Relay — where every fee goes</h1>
  <div class="sub">1.50% both phases · collected internally, split by relay · rates verified on-chain</div>
</header>

<div id="controls">
  <div class="ctl">
    <label>volume</label>
    <input type="range" id="volSlider" min="3" max="6" step="0.01" value="4">
    <span id="vol"></span>
  </div>
  <div class="ctl">
    <label>pool tier</label>
    <select id="tier"></select>
  </div>
  <div class="ctl">
    <label>config</label>
    <div class="seg" id="mode">
      <button data-m="shared" class="on">one platform</button>
      <button data-m="per">per launch</button>
    </div>
  </div>
  <div class="ctl">
    <label>flow</label>
    <div class="seg" id="anim">
      <button data-a="1" class="on">animate</button>
      <button data-a="0">still</button>
    </div>
  </div>
</div>

<div id="wrap">
  <svg id="chart"></svg>
  <div id="side"></div>
</div>
<div id="tip"></div>

<script>
const TIERS = {
  "627Jx6eN61Tr": {trade:0.250, creator:1.250, label:"627Jx6eN61Tr — 1.25% creator"},
  "2fGXL8uhqxJ4": {trade:2.000, creator:0.050, label:"2fGXL8uhqxJ4 — 2.00% trade"},
  "CRRS5ieQmBrZ": {trade:0.250, creator:1.000, label:"CRRS5ieQmBrZ — stonkfun"},
  "FMmwToGqT9iw": {trade:0.005, creator:1.495, label:"FMmwToGqT9iw — 1.495% creator"},
  "C7Cx2pMLtjyb": {trade:4.000, creator:0.050, label:"C7Cx2pMLtjyb — 4.00% trade"},
  "D4FPEruKEHrG": {trade:0.250, creator:0.050, label:"D4FPEruKEHrG — demo tier"}
};
const RAY_CUT = 0.16;
const CURVE_RAY = 0.25, CURVE_US = 1.25;

/* Agreed split. Everything is collected internally — LaunchLab pays no one
   but us — and relay performs every payout. */
const SPLIT = {
  curve: {creator:0.50, rewards:0.00, mf:0.75},
  pool:  {creator:0.50, rewards:0.25, mf:0.71}
};

let vol = 10000, tier = "627Jx6eN61Tr", mode = "shared", animOn = true;

const sel = d3.select("#tier");
sel.selectAll("option").data(Object.entries(TIERS)).join("option")
   .attr("value", d=>d[0]).text(d=>d[1].label);
sel.property("value", tier);

const money = v => v>=1000 ? "$"+d3.format(",.0f")(v) : "$"+d3.format(".2f")(v);
const pct   = v => d3.format(".3f")(v)+"%";

function model(){
  const t = TIERS[tier];
  const curveUs = vol*CURVE_US/100, curveRay = vol*CURVE_RAY/100;
  const trade = vol*t.trade/100;
  const poolRay = trade*RAY_CUT, lp = trade-poolRay;
  const cre = vol*t.creator/100;
  return {curveUs,curveRay,trade,lp,poolRay,cre,
          poolUs:lp+cre, curveTrader:CURVE_RAY+CURVE_US, poolTrader:t.trade+t.creator, t};
}

/* Payouts are denominated deliberately: creator and rewards come out of the
   quote-denominated creator fee, MF absorbs the two-sided LP harvest. */
function payouts(m, phase){
  const s = SPLIT[phase], pot = phase==="curve" ? CURVE_US : m.t.creator+m.t.trade*(1-RAY_CUT);
  return {
    creator:{rate:s.creator, amt:vol*s.creator/100, mint:"quote"},
    rewards:{rate:s.rewards, amt:vol*s.rewards/100, mint:"quote"},
    mf:     {rate:s.mf,      amt:vol*s.mf/100,
             mint: phase==="pool" ? "quote + base" : "quote"},
    pot
  };
}

function nodes(m, per){
  const N = {};
  const add = (id,o)=>N[id]=Object.assign({id},o);

  add("trader1",{x:88,y:140,label:"trader",sub:"curve buy / sell",kind:"actor",
    detail:"Pays "+pct(m.curveTrader)+" on every bonding-curve trade."});
  add("ray1",{x:318,y:62,label:"Raydium",sub:"global tradeFeeRate",kind:"ray",
    detail:"0.25% of volume, fixed by LaunchLab's GlobalConfig. Not ours, not configurable."});
  add("pvault",{x:318,y:186,label:per?"vault / launch":"platform vault",
    sub:per?"[platform_config(mint), quote]":"[platform_config, quote]",
    kind:per?"ours":"pool",
    detail:per
      ? "A PlatformConfig per launch makes this vault unique per mint. Costs 0.00746 SOL rent each. Nobody on mainnet does this."
      : "ONE vault, seeded [platform_config, quote]. Every launch's 1.75% lands here commingled — Raydium's aggregated-vault pattern."});

  if(!per){
    add("sweep",{x:548,y:186,label:"sweep",sub:"claim_platform_fee_from_vault",kind:"ix",
      detail:"CPI. The admin PDA signs. Drains the shared vault into our ATA — all launches at once, one call per quote mint."});
    add("credit",{x:548,y:268,label:"credit",sub:"arithmetic — no money moves",kind:"arith",
      detail:"volume = quote_protocol_fee × 1e6 / trade_fee_rate\nowed = volume × fee_rate − credited_through\n\nRates are READ from the accounts the pool points at, never passed in. ~20 launches per tx."});
    add("dist",{x:712,y:268,label:"distribute",sub:"pays per launch",kind:"ix",
      detail:"Moves tokens from the admin ATA using the figure credit computed. Carries no rates, so it cannot disagree with credit. ~28 per tx, one quote per batch."});
  }

  add("admin",{x:700,y:392,label:"admin PDA",sub:per?'["admin", mint]':'["admin"]',kind:"ours",
    detail:(per
      ? "One money PDA per launch. Holds no data — System refuses to debit a data-carrying account, so it only signs and pays rent."
      : "One PDA for the whole platform. Signs every CPI, holds every balance.")
      + "\n\nEVERY stream lands here first. LaunchLab and CP-Swap pay nobody but us; relay performs all three payouts."});

  add("pcreator",{x:890,y:300,label:"creator",sub:"0.50% both phases",kind:"pay",
    detail:"Paid by RELAY, not by Raydium.\n\nSetting creatorFeeRate = 0 gives up the [creator, quote] vault that only the creator could drain. The 0.50% is now a promise this program keeps rather than one the chain enforces — the one place this structure is less verifiable than the alternative."});
  add("prewards",{x:890,y:392,label:"rewards",sub:"0.25% pool only",kind:"pay",
    detail:"Pool phase only; zero on the curve.\n\nDestination not yet decided — treasury PDA, staking program, or buyback. Drawn as a generic sink until that is settled."});
  add("pmf",{x:890,y:484,label:"MF",sub:"0.75% curve / 0.71% pool",kind:"pay",
    detail:"Takes the residual, and deliberately absorbs the LP harvest — which returns BOTH mints. Creator and rewards are paid from the quote-denominated creator fee so neither is exposed to the launch token."});

  add("trader2",{x:88,y:596,label:"trader",sub:"pool swap",kind:"actor",
    detail:"Pays "+pct(m.poolTrader)+" after graduation. Two independent buckets: trade fee and creator fee."});
  add("ray2",{x:318,y:512,label:"Raydium",sub:"protocol 12% + fund 4%",kind:"ray",
    detail:"16% OF THE TRADE FEE — not of volume, and never of the creator fee. That is why creator-heavy tiers keep more."});
  add("lp",{x:318,y:600,label:"LP share",sub:"84% of trade fee → grows k",kind:"pool",
    detail:"Never a separate balance. It stays in the vault and inflates k, realised only by harvesting the locked position. Returns BOTH mints."});
  add("cfee",{x:318,y:688,label:"creator fee",sub:"PoolState.creator_fees_token*",kind:"ours",
    detail:"A per-pool counter. creator_fee_on tracks the quote automatically — verified across 8 pools where the quote was token1 and Raydium set on=2."});
  add("feekey",{x:548,y:600,label:"harvest",sub:"Burn & Earn, invoke_signed",kind:"ix",
    detail:"The Fee Key NFT is the deed to the locked LP. Proven on mainnet to work from a program-owned PDA — tx 4JdZzDwec8H5, signed via invoke_signed, 18 accounts."});
  add("collect",{x:548,y:688,label:"collect",sub:"CollectCreatorFeePermissionless",kind:"ix",
    detail:"No CPI needed. The permissionless path pays pool_creator's canonical ATAs, so anyone can crank it and the money still lands with us."});

  add("mig",{x:712,y:450,label:"MIGRATION",sub:"curve target reached",kind:"mig",
    detail:"CP-Swap pool is created on the chosen tier.\n\npool_creator = the launch creator, inherited because platform_cp_creator is left DEFAULT.\nFee Key NFT → platform_nft_wallet.\n\nBoth rights land on our PDA."});

  return N;
}

function graph(){
  const m = model(), per = mode==="per";
  const N = nodes(m, per);
  const E = [];
  const e=(s,t,amt,rate,o)=>E.push(Object.assign({s,t,amt,rate},o));

  e("trader1","ray1",   m.curveRay, CURVE_RAY, {kind:"ray",  name:"Raydium curve fee",
     note:"Fixed 0.25%. GlobalConfig.tradeFeeRate — 2500 on all 542 mainnet configs."});
  e("trader1","pvault", m.curveUs,  CURVE_US,  {kind:per?"ours":"pool", name:"platform fee",
     note:"PlatformConfig.fee_rate = 12500 (1.25%), creatorFeeRate = 0. One rate, so the entire curve take lands in a vault we control and relay does the splitting. Devnet-simulated OK."});

  if(per){
    e("pvault","admin", m.curveUs, CURVE_US, {kind:"ours",name:"sweep",
      note:"One vault, one launch. Nothing to attribute — the address IS the attribution."});
  }else{
    e("pvault","sweep", m.curveUs, CURVE_US, {kind:"pool",name:"sweep",
      note:"Pooled money leaves the vault. At this point it belongs to many launches at once."});
    e("sweep","credit", 0, 0, {kind:"arith",name:"credit — the centrifuge",dashed:true,
      note:"Each launch's share is recovered from its OWN pool's quote_protocol_fee, which Raydium records per pool. Exact, not estimated. No tokens move here — only the mark advances."});
    e("credit","dist",  0, 0, {kind:"arith",name:"attributed",dashed:true,
      note:"credited_through advances. quote_protocol_fee is CUMULATIVE and survives claims, so a high-water mark is required or every sweep would re-pay the full lifetime amount."});
    e("dist","admin",   m.curveUs, CURVE_US, {kind:"ours",name:"distribute",
      note:"Now per-launch. Splits by creator_bps, currently 5000 — the open question, since nothing is meant to reach creators."});
  }

  e("trader2","ray2", m.poolRay, m.t.trade*RAY_CUT, {kind:"ray",name:"Raydium pool cut",
     note:"protocolFeeRate 120000 + fundFeeRate 40000 = 16% of the trade fee. Identical on all 21 tiers."});
  e("trader2","lp",   m.lp,  m.t.trade*(1-RAY_CUT), {kind:"pool",name:"LP share",
     note:"84% of the trade fee. Ours only because platform_nft_wallet holds the Fee Key."});
  e("trader2","cfee", m.cre, m.t.creator, {kind:"ours",name:"CPMM creator fee",
     note:"Additive to the trade fee, never carved out of it. Raydium's 16% does not touch it."});
  e("lp","feekey",    m.lp,  m.t.trade*(1-RAY_CUT), {kind:"pool",name:"harvest",
     note:"Returns both mints. A decoded mainnet harvest paid 3,128 memecoin against 0.0096 SOL."});
  e("cfee","collect", m.cre, m.t.creator, {kind:"ours",name:"collect",
     note:"Single mint — the quote. Dust in the non-quote counter confirms it (1, 4, 170, 306 across six pools)."});
  e("feekey","admin", m.lp,  m.t.trade*(1-RAY_CUT), {kind:"pool",name:"to our ATA",
     note:"Under one platform config this lands in the SHARED admin PDA — pooled again, one step later."});
  e("collect","admin",m.cre, m.t.creator, {kind:"ours",name:"to our ATA",
     note:"Pays pool_creator's canonical ATA. Under one config that is the shared admin PDA."});
  e("mig","admin",0,0,{kind:"mig",name:"migration",dashed:true,
     note:"pool_creator and the Fee Key both resolve to our PDA, provided platform_cp_creator stays DEFAULT. Setting it would collapse every pool onto one address."});

  // ── payouts: relay splits what it collected, both phases
  const cP = payouts(m,"curve"), pP = payouts(m,"pool");
  e("admin","pcreator", cP.creator.amt+pP.creator.amt, 0.50, {kind:"pay",name:"creator payout",
     note:"0.50% in BOTH phases, paid in the quote mint. Curve: 4000 of 10000 bps. Pool: 3425 of 10000 bps. Relay's obligation, not Raydium's."});
  e("admin","prewards", pP.rewards.amt, 0.25, {kind:"pay",name:"rewards payout",
     note:"0.25%, pool phase only — 1712 of 10000 bps. Destination still undecided."});
  e("admin","pmf", cP.mf.amt+pP.mf.amt, 0.73, {kind:"pay",name:"MF payout",
     note:"0.75% on the curve (6000 bps), 0.71% in the pool (4863 bps). Absorbs the LP harvest, so MF alone carries the base-mint exposure."});

  return {N,E,m};
}

const svg = d3.select("#chart"), tip = d3.select("#tip");
const COLOR = {ray:"#f85149",pool:"#d29922",ours:"#3fb950",
               arith:"#58a6ff",ix:"#8b949e",actor:"#8b949e",mig:"#bc8cff",
               pay:"#2dd4bf"};

function path(a,b){
  const mx=(a.x+b.x)/2;
  return `M${a.x+64},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x-64},${b.y}`;
}

function draw(){
  const {N,E,m} = graph();
  svg.attr("viewBox","0 0 1020 760").attr("preserveAspectRatio","xMidYMid meet");
  svg.selectAll("*").remove();

  const defs = svg.append("defs");
  Object.entries(COLOR).forEach(([k,v])=>{
    defs.append("marker").attr("id","ar-"+k).attr("viewBox","0 0 10 10")
      .attr("refX",9).attr("refY",5).attr("markerWidth",5).attr("markerHeight",5)
      .attr("orient","auto-start-reverse")
      .append("path").attr("d","M0,1L9,5L0,9z").attr("fill",v);
  });

  const band = svg.append("g");
  band.append("rect").attr("x",818).attr("y",250).attr("width",190).attr("height",290)
    .attr("rx",10).attr("fill","#2dd4bf").attr("opacity",.04)
    .attr("stroke","#2dd4bf").attr("stroke-opacity",.2);
  band.append("text").attr("x",832).attr("y",269).attr("fill","#2dd4bf")
    .attr("font-size",10).attr("letter-spacing",1.4).attr("opacity",.85)
    .text("RELAY SPLITS");

  [["curve — bonding curve",20,300,"#1f6feb"],
   ["pool — after graduation",470,268,"#bc8cff"]].forEach(([t,y,h,c])=>{
    band.append("rect").attr("x",14).attr("y",y).attr("width",780).attr("height",h)
      .attr("rx",10).attr("fill",c).attr("opacity",.04)
      .attr("stroke",c).attr("stroke-opacity",.18);
    band.append("text").attr("x",28).attr("y",y+19).attr("fill",c)
      .attr("font-size",10).attr("letter-spacing",1.4).attr("opacity",.85)
      .text(t.toUpperCase());
  });

  const gE = svg.append("g"), gN = svg.append("g");
  const edges = gE.selectAll("g").data(E).join("g").attr("class","edge");

  edges.append("path")
    .attr("d",d=>path(N[d.s],N[d.t]))
    .attr("fill","none")
    .attr("stroke",d=>COLOR[d.kind])
    .attr("stroke-width",d=>d.amt>0?Math.max(1.4,Math.sqrt(d.rate)*3.4):1.3)
    .attr("stroke-opacity",d=>d.dashed?.45:.62)
    .attr("stroke-dasharray",d=>d.dashed?"5,4":null)
    .attr("marker-end",d=>`url(#ar-${d.kind})`);

  edges.append("path")
    .attr("d",d=>path(N[d.s],N[d.t])).attr("fill","none")
    .attr("stroke","transparent").attr("stroke-width",18)
    .on("mousemove",(ev,d)=>{
      tip.style("opacity",1)
        .style("left",(ev.pageX+14)+"px").style("top",(ev.pageY-10)+"px")
        .html(`<b>${d.name}</b>${d.amt>0?" — "+money(d.amt):""}<br>`+
              `<span style="color:#8b949e">${d.note}</span>`);
    })
    .on("mouseleave",()=>tip.style("opacity",0))
    .on("click",(ev,d)=>sideEdge(d,m));

  edges.filter(d=>d.amt>0).append("text")
    .attr("font-size",10).attr("fill",d=>COLOR[d.kind]).attr("opacity",.9)
    .attr("text-anchor","middle")
    .attr("x",d=>(N[d.s].x+N[d.t].x)/2)
    .attr("y",d=>(N[d.s].y+N[d.t].y)/2-7)
    .text(d=>pct(d.rate));

  if(animOn){
    E.filter(d=>d.amt>0).forEach(d=>{
      const p = path(N[d.s],N[d.t]);
      const ghost = svg.append("path").attr("d",p).attr("fill","none")
        .attr("stroke","none").style("pointer-events","none");
      const len = ghost.node().getTotalLength();
      const count = Math.max(2, Math.round(Math.sqrt(d.rate)*3));
      for(let i=0;i<count;i++){
        const dot = gE.append("circle").attr("r",2.6)
          .attr("fill",COLOR[d.kind]).attr("opacity",.95);
        const run = ()=>dot.transition()
          .delay(i*(2400/count)).duration(2400).ease(d3.easeLinear)
          .attrTween("transform",()=>t=>{
            const q = ghost.node().getPointAtLength(t*len);
            return `translate(${q.x},${q.y})`;
          })
          .on("end",run);
        run();
      }
    });
  }

  const ns = gN.selectAll("g").data(Object.values(N)).join("g")
    .attr("class","node").attr("transform",d=>`translate(${d.x},${d.y})`);

  ns.append("rect")
    .attr("x",-64).attr("y",-23).attr("width",128).attr("height",46).attr("rx",7)
    .attr("fill","#161b22")
    .attr("stroke",d=>COLOR[d.kind])
    .attr("stroke-opacity",d=>d.kind==="mig"?.8:.55)
    .attr("stroke-width",d=>d.kind==="mig"?1.6:1.1)
    .attr("stroke-dasharray",d=>d.kind==="arith"||d.kind==="mig"?"4,3":null);

  ns.append("text").attr("text-anchor","middle").attr("y",-3)
    .attr("font-size",11.5).attr("font-weight",600)
    .attr("fill",d=>COLOR[d.kind]).text(d=>d.label);
  ns.append("text").attr("text-anchor","middle").attr("y",11)
    .attr("font-size",8).attr("fill","#8b949e")
    .text(d=>d.sub.length>26?d.sub.slice(0,25)+"…":d.sub);

  ns.on("mousemove",(ev,d)=>{
      tip.style("opacity",1)
        .style("left",(ev.pageX+14)+"px").style("top",(ev.pageY-10)+"px")
        .html(`<b>${d.label}</b><br><span style="color:#8b949e">${d.sub}</span>`+
              `<br><br>${d.detail.replace(/\n/g,"<br>")}`);
    })
    .on("mouseleave",()=>tip.style("opacity",0))
    .on("click",(ev,d)=>sideNode(d,m));

  totals(m);
}

const EVIDENCE = {
  "credit — the centrifuge":"Predicted 8,857 — actual vault 8,857. Verified against a live mainnet pool.",
  "harvest":"mainnet tx 4JdZzDwec8H5… — a program-owned PDA signs the Burn & Earn CPI via invoke_signed. 56 of 120 sampled lock-program txs are CPMM-venue.",
  "collect":"creator_fee_on is set to 1 or 2 by LaunchLab so the fee always lands on the quote. Non-quote counters hold dust: 1, 4, 170, 306.",
  "platform fee":"fee_rate cap 50000 confirmed on devnet. claim_platform_fee (per-pool) is vestigial — always 6009 NoAssetsToCollect.",
  "CPMM creator fee":"Raydium docs: “The creator fee is not a slice of the trade fee. The two rates are added together.”",
  "Raydium pool cut":"protocolFeeRate 120000 + fundFeeRate 40000 on every one of the 21 tiers."
};

function sideEdge(d,m){
  d3.select("#side").html(`
    <h2 style="color:${COLOR[d.kind]}">${d.name.toUpperCase()}</h2>
    <div class="rate" style="color:${COLOR[d.kind]}">${d.rate>0?pct(d.rate):"—"}</div>
    <div class="amt">${d.amt>0?money(d.amt)+" on "+money(vol)+" of volume":"no tokens move"}</div>
    <div class="hint">${d.note}</div>
    ${EVIDENCE[d.name]?`<div class="ev"><b>verified</b>${EVIDENCE[d.name]}</div>`:""}
  `);
  totals(m,true);
}

function sideNode(d,m){
  d3.select("#side").html(`
    <h2 style="color:${COLOR[d.kind]}">${d.label.toUpperCase()}</h2>
    <div class="amt" style="margin-top:6px">${d.sub}</div>
    <div class="hint">${d.detail.replace(/\n/g,"<br>")}</div>
  `);
  totals(m,true);
}

function totals(m,append){
  const t = m.t, host = d3.select("#side");
  if(!append) host.html("");
  host.append("div").attr("class","totals").html(`
    <div style="color:#8b949e;font-size:10px;letter-spacing:.7px;margin-bottom:9px">
      ON ${money(vol)} OF VOLUME</div>
    <div class="trow"><span style="color:#8b949e">curve · trader pays</span><b>${pct(m.curveTrader)}</b></div>
    <div class="trow"><span style="color:#f85149">curve · Raydium</span><b>${money(m.curveRay)} · ${pct(CURVE_RAY)}</b></div>
    <div class="trow"><span style="color:#3fb950">curve · relay collects</span><b>${money(m.curveUs)} · ${pct(CURVE_US)}</b></div>
    <div class="trow" style="padding-left:12px"><span style="color:#2dd4bf">↳ creator</span><b>${money(vol*.005)} · 0.500%</b></div>
    <div class="trow" style="padding-left:12px"><span style="color:#2dd4bf">↳ MF</span><b>${money(vol*.0075)} · 0.750%</b></div>
    <div style="height:12px"></div>
    <div class="trow"><span style="color:#8b949e">pool · trader pays</span><b>${pct(m.poolTrader)}</b></div>
    <div class="trow"><span style="color:#f85149">pool · Raydium</span><b>${money(m.poolRay)} · ${pct(t.trade*RAY_CUT)}</b></div>
    <div class="trow"><span style="color:#3fb950">pool · relay collects</span><b>${money(m.poolUs)} · ${pct(t.trade*(1-RAY_CUT)+t.creator)}</b></div>
    <div class="trow" style="padding-left:12px"><span style="color:#2dd4bf">↳ creator</span><b>${money(vol*.005)} · 0.500%</b></div>
    <div class="trow" style="padding-left:12px"><span style="color:#2dd4bf">↳ rewards</span><b>${money(vol*.0025)} · 0.250%</b></div>
    <div class="trow" style="padding-left:12px"><span style="color:#2dd4bf">↳ MF</span><b>${money(m.poolUs-vol*.0075)} · ${pct((m.poolUs-vol*.0075)/vol*100)}</b></div>
    <div style="margin-top:14px;font-size:10.5px;color:#8b949e;line-height:1.65">
      ${mode==="per"
        ? "Per-launch config: the curve vault is unique per mint, so no centrifuge runs. Costs 0.00746 SOL rent per launch, and nobody on mainnet does this."
        : "One platform config: the curve fee lands commingled and is spun apart by credit. The pool fees accrue per-pool but still land in the shared admin PDA."}
    </div>
  `);
}

function setVol(){
  vol = Math.round(Math.pow(10, +d3.select("#volSlider").property("value")));
  d3.select("#vol").text(money(vol));
}

d3.select("#volSlider").on("input",()=>{setVol();draw();});
d3.select("#tier").on("change",function(){tier=this.value;draw();});
d3.selectAll("#mode button").on("click",function(){
  d3.selectAll("#mode button").classed("on",false);
  d3.select(this).classed("on",true);
  mode=this.dataset.m; draw();
});
d3.selectAll("#anim button").on("click",function(){
  d3.selectAll("#anim button").classed("on",false);
  d3.select(this).classed("on",true);
  animOn=this.dataset.a==="1"; draw();
});

setVol();
draw();
d3.select("#side").html(`
  <h2>RELAY FEE FLOW</h2>
  <div class="hint" style="margin-top:10px">
    1.5% in both phases. Everything is collected internally — LaunchLab and
    CP-Swap pay nobody but us — then relay splits it.<br><br>
    <span style="color:#f85149">■</span> Raydium's cut<br>
    <span style="color:#d29922">■</span> pooled — needs attribution<br>
    <span style="color:#3fb950">■</span> per-launch already<br>
    <span style="color:#2dd4bf">■</span> relay payout<br>
    <span style="color:#58a6ff">┄</span> arithmetic, no tokens move
  </div>`);
totals(model(),true);
</script>
</body>
</html>
